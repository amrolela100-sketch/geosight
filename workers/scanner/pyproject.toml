[project]
name = "geosight-scanner"
version = "0.0.0"
description = "GeoSight Python workers — async scanners for ChatGPT/Gemini/Perplexity and the Arabic NLP parser."
readme = ""
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "GeoSight" }]

# Dependencies will be locked when Phase 0 (scanner spike) lands.
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = ["S101"]  # allow `assert` in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
