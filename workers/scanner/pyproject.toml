[project]
name = "geosight-scanner"
version = "0.0.0"
description = "GeoSight Python workers — async scanners for ChatGPT/Gemini/Perplexity and the Arabic NLP parser."
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "GeoSight" }]

dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rapidfuzz>=3.9",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  "rich>=13.7",
  # Worker bridge (Phase 2 W8): consume BullMQ jobs enqueued by apps/api and
  # persist scan_results via asyncpg. The TS/Python BullMQ packages share the
  # same Lua scripts, so cross-language enqueue → consume works as-is.
  "bullmq>=2.7",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
]

[project.scripts]
geosight-scan = "geosight_scanner.cli:app"
geosight-worker = "geosight_scanner.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosight_scanner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = [
  "S101",    # allow `assert` in tests
  "S311",    # PRNG is used only for deterministic fixture latency
  "RUF001",  # Arabic source strings are expected in this project
  "RUF002",  # Arabic docstrings are expected in this project
  "RUF003",  # Arabic comments are expected in this project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# bullmq + asyncpg ship without inline stubs; treat them as Any at the
# adapter boundary and validate shapes locally.
module = ["bullmq.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
