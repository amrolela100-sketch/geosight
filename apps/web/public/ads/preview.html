<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoSight Ad Assets</title>
  <style>
    body { margin: 0; background: #050713; color: #f8fafc; font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(1180px, calc(100% - 40px)); margin: 40px auto; display: grid; gap: 28px; }
    h1 { margin: 0 0 8px; }
    p { color: #aab4cf; margin: 0 0 20px; }
    figure { margin: 0; display: grid; gap: 10px; }
    img { width: 100%; height: auto; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: #080b1a; }
    figcaption { color: #cbd5e1; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>صور GeoSight الإعلانية</h1>
      <p>نسخ SVG جاهزة، ومعها PNG بعد التصدير.</p>
    </div>
    <figure><img src="./geosight-hero-ad.svg" alt="geosight-hero-ad.svg" /><figcaption>geosight-hero-ad.svg - 1600x900</figcaption></figure>
<figure><img src="./geosight-social-square.svg" alt="geosight-social-square.svg" /><figcaption>geosight-social-square.svg - 1080x1080</figcaption></figure>
<figure><img src="./geosight-story-ad.svg" alt="geosight-story-ad.svg" /><figcaption>geosight-story-ad.svg - 1080x1920</figcaption></figure>
<figure><img src="./geosight-og-ad.svg" alt="geosight-og-ad.svg" /><figcaption>geosight-og-ad.svg - 1200x628</figcaption></figure>
  </main>
</body>
</html>
